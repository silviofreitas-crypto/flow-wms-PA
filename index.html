<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FLOW WMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .input-login { width: 100%; background-color: #f1f5f9; border: 2px solid transparent; color: #1e293b; font-weight: 600; border-radius: 1rem; padding: 1rem 1.25rem; outline: none; }
    .input-login:focus { background-color: #ffffff; border-color: #0055A5; }
  </style>
<!-- Configurações do App (PWA) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#001A70">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3058/3058962.png">
</head>
<body class="h-screen w-full flex bg-white">

  <div class="hidden md:flex md:w-1/2 bg-gradient-to-br from-[#001A70] to-[#0055A5] flex-col justify-between p-12 text-white relative">
    <div>
      <h1 class="text-4xl font-black tracking-widest mb-2">FLOW<span class="text-[#00B5E2] font-light">WMS</span></h1>
      <p class="text-sm font-medium text-blue-200 uppercase tracking-widest">Produto Acabado</p>
    </div>
    <div>
      <h2 class="text-5xl font-black leading-tight mb-4">Gestão<br>Inteligente.</h2>
      <p class="text-lg text-blue-100 max-w-md">Controle de inventário e roteirização integrados.</p>
    </div>
  </div>

  <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-slate-50">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
      <div class="mb-8">
        <h3 class="text-2xl font-black text-slate-800">Acesso ao Sistema</h3>
        <p class="text-sm text-slate-500 mt-1">Insira seu usuário para continuar.</p>
      </div>

      <form onsubmit="realizarLogin(event)" class="space-y-5">
        <div>
          <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Usuário</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="loginUsuario" required class="input-login pl-11 lowercase" placeholder="Ex: dev">
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Senha</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="loginSenha" required class="input-login pl-11" placeholder="••••••••">
          </div>
        </div>
        <button type="submit" id="btnLogar" class="w-full bg-[#0055A5] hover:bg-blue-800 text-white font-black py-4 rounded-xl shadow-lg mt-4">ENTRAR <i class="fa-solid fa-arrow-right"></i></button>
      </form>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://cbrwmscaidyeaamyfiyt.supabase.co';
    const supabaseKey = 'sb_publishable_neiGbVa2X1nBfX5wT3UGYw_3RWe43_G';
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    window.onload = () => { if (localStorage.getItem('flowWmsUser')) window.location.href = 'painel.html'; };

    async function realizarLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUsuario').value.trim().toLowerCase();
      const pass = document.getElementById('loginSenha').value;
      const btn = document.getElementById('btnLogar');

      btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;

      const { data, error } = await client.from('usuarios').select('*').eq('login', user).eq('senha', pass).single();

      if (error || !data) {
        Swal.fire('Acesso Negado', 'Usuário ou senha incorretos.', 'error');
        btn.disabled = false; btn.innerHTML = `ENTRAR <i class="fa-solid fa-arrow-right"></i>`;
      } else {
        localStorage.setItem('flowWmsUser', JSON.stringify(data));
        window.location.href = 'painel.html'; // REDIRECIONA PARA O PAINEL
      }
    }
  </script>
</body>
</html>
