<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login | FLOW WMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
<!-- Configurações do App (PWA) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a192f">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .input-login { width: 100%; background-color: #f1f5f9; border: 2px solid transparent; color: #1e293b; font-weight: 600; border-radius: 1rem; padding: 1rem 1.25rem; outline: none; }
    .input-login:focus { background-color: #ffffff; border-color: #0055A5; }
    
    /* Personaliza o Modal do SweetAlert2 */
    .swal2-popup { border-radius: 1.5rem !important; }
    .swal2-input { font-family: 'Inter', sans-serif !important; border-radius: 0.75rem !important; font-weight: 700 !important; }
  </style>

</head>
<body class="min-h-screen w-full flex flex-col md:flex-row bg-slate-50 md:bg-white overflow-y-auto">

  <!-- HEADER MOBILE (Exclusivo para o PDA) -->
  <div class="md:hidden w-full bg-gradient-to-br from-[#001A70] to-[#0055A5] p-8 text-white text-center rounded-b-[2rem] shadow-xl mb-6">
    <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-4 backdrop-blur-sm border border-white/20">
      <i class="fa-solid fa-cube text-[#00B5E2]"></i>
    </div>
    <h1 class="text-4xl font-black tracking-widest mb-1">FLOW<span class="text-[#00B5E2] font-light">WMS</span></h1>
    <p class="text-[10px] font-bold text-blue-200 uppercase tracking-widest">Produto Acabado</p>
  </div>

  <!-- LADO ESQUERDO (Apenas Desktop) -->
  <div class="hidden md:flex md:w-1/2 bg-gradient-to-br from-[#001A70] to-[#0055A5] flex-col justify-between p-12 text-white relative">
    <div>
      <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-2xl mb-4 border border-white/20">
        <i class="fa-solid fa-cube text-[#00B5E2]"></i>
      </div>
      <h1 class="text-4xl font-black tracking-widest mb-2">FLOW<span class="text-[#00B5E2] font-light">WMS</span></h1>
      <p class="text-sm font-medium text-blue-200 uppercase tracking-widest">Produto Acabado</p>
    </div>
    <div>
      <h2 class="text-5xl font-black leading-tight mb-4">Gestão<br>Inteligente.</h2>
      <p class="text-lg text-blue-100 max-w-md">Controle de inventário e roteirização integrados.</p>
    </div>
  </div>

  <!-- LADO DIREITO (Login) -->
  <div class="w-full md:w-1/2 flex items-center justify-center p-6 md:p-8 flex-1">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100 relative">
      <div class="mb-8">
        <h3 class="text-2xl font-black text-slate-800">Acesso ao Sistema</h3>
        <p class="text-sm text-slate-500 mt-1">Insira suas credenciais.</p>
      </div>

      <form onsubmit="realizarLogin(event)" class="space-y-5">
        <div>
          <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Usuário</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="loginUsuario" required class="input-login pl-11 lowercase" placeholder="Ex: dev">
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Senha</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="loginSenha" required class="input-login pl-11" placeholder="••••••••">
          </div>
        </div>
        <button type="submit" id="btnLogar" class="w-full bg-[#0055A5] hover:bg-blue-800 active:scale-95 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all mt-4 flex justify-center items-center gap-2">
          ENTRAR <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://cbrwmscaidyeaamyfiyt.supabase.co';
    const supabaseKey = 'sb_publishable_neiGbVa2X1nBfX5wT3UGYw_3RWe43_G';
    const client = window.supabase.createClient(supabaseUrl, supabaseKey);

    window.onload = () => { if (localStorage.getItem('flowWmsUser')) window.location.href = 'painel.html'; };

    async function realizarLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUsuario').value.trim().toLowerCase();
      const pass = document.getElementById('loginSenha').value;
      const btn = document.getElementById('btnLogar');

      btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> VERIFICANDO...`;

      const { data, error } = await client.from('usuarios').select('*').eq('login', user).eq('senha', pass).single();

      if (error || !data) {
        Swal.fire('Acesso Negado', 'Usuário ou senha incorretos.', 'error');
        btn.disabled = false; btn.innerHTML = `ENTRAR <i class="fa-solid fa-arrow-right"></i>`;
      } else {
        // LÓGICA DE SENHA PADRÃO: Se for 1234, barra a entrada e pede troca obrigatória.
        if (data.senha === '1234') {
            btn.disabled = false; btn.innerHTML = `ENTRAR <i class="fa-solid fa-arrow-right"></i>`;
            abrirModalTrocaSenha(data);
        } else {
            localStorage.setItem('flowWmsUser', JSON.stringify(data));
            window.location.href = 'painel.html'; 
        }
      }
    }

    async function abrirModalTrocaSenha(user) {
        const { value: formValues } = await Swal.fire({
            title: 'Troca de Senha Exigida',
            html: `
                <div class="text-left bg-slate-50 p-4 border border-slate-200 rounded-xl mb-4">
                    <p class="text-sm font-bold text-slate-700">Olá, <span class="text-[#0055A5] font-black">${user.nome}</span>!</p>
                    <p class="text-xs text-slate-500 mt-1">Como você está usando a senha padrão, precisamos que crie uma senha segura para proteger sua conta.</p>
                </div>
                <input id="swal-nova" type="password" class="swal2-input !mt-1 !mb-3" placeholder="Digite a nova senha">
                <input id="swal-confirma" type="password" class="swal2-input !mt-0 !mb-2" placeholder="Repita a nova senha">
                <div class="text-left pl-1">
                    <p class="text-[10px] font-bold text-slate-400 mt-2 uppercase tracking-widest"><i class="fa-solid fa-check text-emerald-500 mr-1"></i> Mínimo de 6 dígitos</p>
                    <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest"><i class="fa-solid fa-check text-emerald-500 mr-1"></i> Apenas letras e/ou números</p>
                    <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest"><i class="fa-solid fa-xmark text-red-500 mr-1"></i> Não use espaços ou @, !, #, -</p>
                </div>
            `,
            focusConfirm: false,
            allowOutsideClick: false,
            showCancelButton: true,
            cancelButtonText: 'Cancelar Login',
            confirmButtonText: 'Salvar Nova Senha',
            confirmButtonColor: '#0055A5',
            preConfirm: () => {
                const pass1 = document.getElementById('swal-nova').value;
                const pass2 = document.getElementById('swal-confirma').value;
                
                if (!pass1 || !pass2) {
                    Swal.showValidationMessage('Preencha os dois campos.');
                    return false;
                }
                if (pass1 !== pass2) {
                    Swal.showValidationMessage('As senhas não coincidem.');
                    return false;
                }
                if (pass1 === '1234') {
                    Swal.showValidationMessage('A nova senha não pode ser 1234.');
                    return false;
                }
                if (pass1.length < 6) {
                    Swal.showValidationMessage('A senha precisa ter pelo menos 6 dígitos.');
                    return false;
                }
                // Expressão Regular: Exige que só existam letras e números
                const regexAlfanumerico = /^[a-zA-Z0-9]+$/;
                if (!regexAlfanumerico.test(pass1)) {
                    Swal.showValidationMessage('Caracteres inválidos! Use APENAS letras e números.');
                    return false;
                }
                
                return pass1;
            }
        });

        if (formValues) {
            Swal.fire({ title: 'Salvando nova senha...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
            
            // Atualiza a senha no banco
            const { error } = await client.from('usuarios').update({ senha: formValues }).eq('id', user.id);
            
            if (error) {
                Swal.fire('Erro', 'Não foi possível alterar a senha. Tente novamente.', 'error');
            } else {
                // Atualiza o objeto do usuário logado localmente e libera o acesso
                user.senha = formValues;
                localStorage.setItem('flowWmsUser', JSON.stringify(user));
                
                Swal.fire({
                    title: 'Senha Alterada!',
                    text: 'Seu acesso está seguro. Entrando no sistema...',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'painel.html';
                });
            }
        }
    }
  </script>
</body>
</html>
