<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Transporte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding: 1.5rem; margin: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .swal-desktop-modal { border-radius: 1rem !important; }

    /* Nova Tabela de Cards Espaçados */
    .tb-cards { width: 100%; border-collapse: separate; border-spacing: 0 1rem; }
    .tb-cards th { padding: 0 1.5rem 0.5rem 1.5rem; font-size: 0.65rem; font-weight: 900; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; border: none; text-align: left; }
    .tb-cards td { padding: 1.5rem; background: #ffffff; color: #334155; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    .tb-cards td:first-child { border-left: 1px solid #e2e8f0; border-top-left-radius: 1rem; border-bottom-left-radius: 1rem; }
    .tb-cards td:last-child { border-right: 1px solid #e2e8f0; border-top-right-radius: 1rem; border-bottom-right-radius: 1rem; }
    .tb-cards tr { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s; }
    .tb-cards tr:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

  <main class="flex-grow w-full max-w-[1600px] mx-auto flex flex-col h-[90vh]">
    
    <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200 shrink-0 mb-2 border-l-8 border-l-sky-500">
      <div class="flex items-center gap-4">
        <div class="bg-sky-50 text-sky-600 w-14 h-14 rounded-xl text-2xl flex items-center justify-center border border-sky-100 shadow-sm"><i class="fa-solid fa-route"></i></div>
        <div>
          <h1 class="text-2xl font-black text-slate-800 tracking-tight leading-none">Gestão de Transporte</h1>
          <p class="text-slate-500 font-bold text-sm mt-1">Definição de Destinos (CIG, Itupeva, Clientes, etc.)</p>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="relative">
          <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="inpBuscaCarga" onkeyup="filtrarCargas()" class="pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl shadow-inner text-sm font-bold w-72 outline-none focus:border-sky-500 transition-colors uppercase" placeholder="Buscar PICK # ou Destino...">
        </div>
        <button onclick="carregarCargasTransporte()" class="bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl font-black text-xs transition-colors shadow-md flex items-center gap-2 active:scale-95"><i class="fa-solid fa-rotate-right"></i> Atualizar Lista</button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar px-2 pb-10">
      <table class="tb-cards">
        <thead class="sticky top-0 bg-[#f8fafc] z-10 pt-4">
          <tr>
            <th class="w-[12%]">Ordem</th>
            <th class="w-[35%]">Itens & Lotes Agrupados (Total)</th>
            <th class="w-[15%] text-center">Status Operacional</th>
            <th class="w-[20%]">Destino Definido</th>
            <th class="w-[18%] text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="tbCargas">
          <tr><td colspan="5" class="text-center py-12 font-bold text-slate-400 rounded-2xl"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 block"></i> Buscando cargas ativas...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script>
    const client = window.supabase.createClient('https://cbrwmscaidyeaamyfiyt.supabase.co', 'sb_publishable_neiGbVa2X1nBfX5wT3UGYw_3RWe43_G');
    let cargasGlobais = [];
    let produtosGlobais = {};

    window.onload = () => carregarCargasTransporte();

    function filtrarCargas() {
      let termo = document.getElementById('inpBuscaCarga').value.toLowerCase();
      let trs = document.querySelectorAll('.linha-carga');
      trs.forEach(tr => {
        let texto = tr.innerText.toLowerCase();
        tr.style.display = texto.includes(termo) ? '' : 'none';
      });
    }

    async function carregarCargasTransporte() {
      const tb = document.getElementById('tbCargas');
      tb.innerHTML = '<tr><td colspan="5" class="text-center py-12 font-bold text-slate-400 bg-white rounded-2xl border border-slate-200"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 block"></i> Atualizando...</td></tr>';
      
      const {data: prods} = await client.from('produtos_moove').select('*');
      if(prods) prods.forEach(p => produtosGlobais[p.n_item] = p);

      const { data: ativas } = await client.from('wms_cargas').select('*, wms_paletes(*)').neq('status', 'EXPEDIDA').order('id', {ascending: false});

      if(!ativas || ativas.length === 0) {
        return tb.innerHTML = '<tr><td colspan="5" class="text-center py-16 font-black text-slate-300 text-lg bg-white rounded-2xl border border-dashed border-slate-200"><i class="fa-solid fa-mug-hot text-4xl mb-4 block"></i>Pátio limpo!<br><span class="text-sm text-slate-400">Nenhuma carga em andamento aguardando rota.</span></td></tr>';
      }

      cargasGlobais = ativas;
      let html = '';

      ativas.forEach(c => {
        let total = c.wms_paletes.length;
        if(total === 0) return;

        // Agrupa os itens e lotes
        let mapItens = {};
        c.wms_paletes.forEach(p => {
          let key = `${p.n_item}|${p.lote}`;
          if(!mapItens[key]) mapItens[key] = { item: p.n_item, lote: p.lote, qtd: 0 };
          mapItens[key].qtd += parseFloat(p.qtd);
        });

        let htmlItens = '<div class="flex flex-col gap-2">';
        for(let k in mapItens) {
          let desc = produtosGlobais[mapItens[k].item] ? produtosGlobais[mapItens[k].item].descricao : 'S/ DESC';
          htmlItens += `
            <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl flex justify-between items-center shadow-sm">
              <div>
                <div class="flex items-center gap-2 mb-1.5">
                  <span class="bg-slate-800 text-white px-2 py-0.5 rounded font-black text-[10px] tracking-wider shadow-sm">${mapItens[k].item}</span> 
                  <span class="text-[11px] font-bold text-slate-700 truncate max-w-[280px]" title="${desc}">${desc}</span>
                </div>
                <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest"><i class="fa-solid fa-tag mr-1"></i> LOTE FÍSICO: ${mapItens[k].lote}</div>
              </div>
              <div class="text-sm font-black text-sky-700 bg-sky-100 border border-sky-200 px-3 py-1.5 rounded-lg shadow-sm">${mapItens[k].qtd} <span class="text-[9px]">UN</span></div>
            </div>`;
        }
        htmlItens += '</div>';

        let badgeStatus = c.status === 'ROTEIRIZADA' ? '<span class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded font-black text-[10px] uppercase tracking-wider border border-slate-200 shadow-sm"><i class="fa-solid fa-clock mr-1"></i> Na Fila</span>' :
                          c.status === 'SEPARACAO' ? '<span class="bg-orange-100 text-orange-700 px-3 py-1.5 rounded font-black text-[10px] uppercase tracking-wider border border-orange-200 shadow-sm"><i class="fa-solid fa-dolly mr-1"></i> Separando</span>' :
                          c.status === 'CONFERENCIA' ? '<span class="bg-yellow-100 text-yellow-700 px-3 py-1.5 rounded font-black text-[10px] uppercase tracking-wider border border-yellow-200 shadow-sm"><i class="fa-solid fa-clipboard-check mr-1"></i> Em Auditoria</span>' :
                          '<span class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded font-black text-[10px] uppercase tracking-wider border border-blue-200 shadow-sm"><i class="fa-solid fa-truck-ramp-box mr-1"></i> Na Doca / Load</span>';

        let pendenteTransp = (!c.destino || c.destino === 'A DEFINIR');
        
        let blockDestino = pendenteTransp 
          ? `<div class="bg-red-50 text-red-600 border border-red-200 p-3 rounded-xl text-xs font-black shadow-inner w-fit"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Destino Pendente</div>`
          : `<div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl shadow-inner w-fit">
              <div class="text-sm font-black text-emerald-700 truncate max-w-[200px]" title="${c.destino}"><i class="fa-solid fa-location-dot mr-1 text-emerald-500"></i> ${c.destino}</div>
             </div>`;

        let btnAcao = pendenteTransp 
          ? `<button onclick="definirRota(${c.id})" class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-3 rounded-xl text-xs font-black shadow-md transition-all active:scale-95 uppercase w-full flex justify-center items-center gap-2"><i class="fa-solid fa-map-location-dot text-lg"></i> Definir Destino</button>`
          : `<button onclick="definirRota(${c.id})" class="bg-white hover:bg-slate-50 border-2 border-sky-400 text-sky-600 px-5 py-3 rounded-xl text-xs font-black shadow-sm transition-all active:scale-95 uppercase w-full flex justify-center items-center gap-2"><i class="fa-solid fa-pen-to-square text-lg"></i> Editar Destino</button>`;

        html += `
          <tr class="linha-carga group">
            <td class="align-top">
              <span class="font-black text-slate-800 text-lg block mb-1">PICK #${c.id}</span>
              <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50 px-2 py-1 border border-slate-100 rounded block w-fit">CLI: ${c.cliente}</span>
            </td>
            <td class="align-top">${htmlItens}</td>
            <td class="text-center align-middle">${badgeStatus}</td>
            <td class="align-middle">${blockDestino}</td>
            <td class="text-center align-middle">${btnAcao}</td>
          </tr>`;
      });
      tb.innerHTML = html;
    }

    async function definirRota(idCarga) {
      let carga = cargasGlobais.find(c => c.id == idCarga);
      
      const { value: dest } = await Swal.fire({
        title: 'Definição de Destino',
        width: '500px',
        customClass: { popup: 'swal-desktop-modal' },
        html: `
          <div class="text-left text-sm mt-2">
            <div class="bg-sky-50 border border-sky-200 p-3 rounded-lg text-sky-700 text-[11px] font-bold mb-5 shadow-inner">
              Para onde esta carga vai? A transportadora e os dados do motorista serão definidos posteriormente pela Doca (SEC).
            </div>
            <div>
              <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Destino Oficial <span class="text-red-500">*</span></label>
              <input id="swal-dest" class="w-full bg-white border-2 border-slate-300 p-3.5 rounded-xl shadow-sm font-black uppercase text-slate-800 outline-none focus:border-sky-500 text-sm transition-colors" value="${carga.destino === 'A DEFINIR' ? '' : (carga.destino || '')}" placeholder="Ex: CIG, ITUPEVA, CLIENTE X...">
            </div>
          </div>
        `,
        focusConfirm: false, 
        showCancelButton: true, 
        confirmButtonColor: '#0ea5e9', 
        confirmButtonText: '<i class="fa-solid fa-floppy-disk"></i> Salvar Destino', 
        cancelButtonText: 'Cancelar',
        preConfirm: () => {
          return document.getElementById('swal-dest').value.trim().toUpperCase();
        }
      });

      if (dest !== undefined) {
        if(!dest) return Swal.fire('Atenção', 'O Destino é obrigatório.', 'warning');
        
        Swal.fire({title: 'Salvando...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
        
        // Apenas atualiza o destino. Mantém Transportadora para o SEC
        await client.from('wms_cargas').update({
          destino: dest
        }).eq('id', idCarga);

        Swal.fire('Destino Salvo!', 'A rota foi definida com sucesso e já está disponível para o SEC.', 'success');
        carregarCargasTransporte();
      }
    }
  </script>
</body>
</html>
