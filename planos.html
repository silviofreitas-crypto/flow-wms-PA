<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; padding: 2rem; }
    .card-modern { background: white; border-radius: 1.25rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .input-modern { width: 100%; background-color: #f8fafc; border: 2px solid #e2e8f0; color: #1e293b; font-weight: 700; border-radius: 0.75rem; padding: 0.75rem 1rem; outline: none; transition: all 0.2s; font-size: 0.875rem; }
    .input-modern:focus { background-color: #ffffff; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  </style>
</head>
<body class="flex flex-col h-[90vh]">

  <div class="max-w-[1400px] w-full mx-auto flex flex-col lg:flex-row gap-6 h-full">
    
    <!-- LADO ESQUERDO: NOVO PLANO -->
    <div class="w-full lg:w-1/3 card-modern p-6 flex flex-col h-full border-t-4 border-t-indigo-600">
      <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4 shrink-0">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl shadow-sm"><i class="fa-solid fa-industry"></i></div>
        <div>
            <h2 class="text-xl font-black text-slate-800 tracking-tight leading-none">Novo Plano</h2>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">Apontamento de Produção</p>
        </div>
      </div>
      
      <div class="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-5">
        <div>
          <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Buscar Produto <span class="text-red-500">*</span></label>
          <div class="flex gap-2">
            <input type="text" id="buscaProd" class="input-modern uppercase" placeholder="Cód. Elvin, Pax ou Descrição..." onkeydown="if(event.key === 'Enter') buscarProduto()">
            <button onclick="buscarProduto()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 rounded-xl font-black shadow-sm transition-transform active:scale-95"><i class="fa-solid fa-search"></i></button>
          </div>
        </div>
        
        <div id="resBusca" class="text-sm space-y-2"></div>
        
        <div id="formPlano" class="hidden space-y-5 mt-2 pt-5 border-t border-slate-100">
          <input type="hidden" id="nItemSelecionado">
          
          <div class="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl relative overflow-hidden">
            <i class="fa-solid fa-box-open absolute -right-3 -bottom-3 text-5xl text-indigo-100"></i>
            <p class="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1 relative z-10">Produto Vinculado</p>
            <p id="descSelecionado" class="font-bold text-slate-700 text-xs leading-tight mb-3 relative z-10 max-w-[90%] truncate"></p>
            <div class="flex flex-wrap gap-2 relative z-10">
              <span id="badgeMoove" class="bg-white text-slate-600 border border-slate-200 px-2 py-0.5 rounded text-[9px] font-black uppercase"></span>
              <span id="badgePax" class="bg-white text-slate-600 border border-slate-200 px-2 py-0.5 rounded text-[9px] font-black uppercase"></span>
              <span id="badgePalete" class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 rounded text-[9px] font-black uppercase"></span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
              <div>
                  <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Lote Físico <span class="text-red-500">*</span></label>
                  <input type="text" id="loteProd" class="input-modern uppercase" placeholder="Nº Lote">
              </div>
              <div>
                  <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Fabricação <span class="text-red-500">*</span></label>
                  <input type="date" id="dataProd" class="input-modern text-xs">
              </div>
          </div>
          
          <div>
            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Linha de Envase <span class="text-red-500">*</span></label>
            <div class="relative">
                <select id="linhaEnvase" class="input-modern cursor-pointer appearance-none">
                  <option value="">-- Selecione a Linha --</option>
                  <option value="24x1">Linha 24x1</option>
                  <option value="9x1">Linha 9x1</option>
                  <option value="24x0.5">Linha 24 x 0.5</option>
                  <option value="12x1">Linha 12x1</option>
                  <option value="Tambores">Linha Tambores</option>
                  <option value="Bombonas">Linha Bombonas</option>
                  <option value="Serac">Linha Serac</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
          </div>

          <div>
              <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-1.5">Qtd Planejada (ERP) <span class="text-red-500">*</span></label>
              <input type="number" id="qtdPlan" class="input-modern text-indigo-700 text-2xl font-black text-center bg-indigo-50/30 border-indigo-200 py-4" placeholder="0">
          </div>
        </div>
      </div>
      
      <div class="pt-4 border-t border-slate-100 mt-2 shrink-0">
          <button id="btnAbrir" onclick="abrirPlano()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-md transition-transform active:scale-95 flex justify-center items-center gap-2 uppercase tracking-wide text-sm hidden">
              <i class="fa-solid fa-play"></i> Iniciar Plano WMS
          </button>
      </div>
    </div>

    <!-- LADO DIREITO: LISTAGEM DE PLANOS ABERTOS -->
    <div class="w-full lg:w-2/3 card-modern p-6 flex flex-col h-full bg-slate-50 border-none">
      <div class="flex justify-between items-center mb-6 pb-2 shrink-0">
        <div>
            <h2 class="text-xl font-black text-slate-800 tracking-tight flex items-center gap-2"><i class="fa-solid fa-gears text-indigo-600"></i> Produção em Andamento</h2>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">Lotes aguardando encerramento físico</p>
        </div>
        <button onclick="carregarPlanos()" class="bg-white border border-slate-200 text-slate-600 hover:text-indigo-600 px-4 py-2 rounded-xl text-xs font-black shadow-sm transition-colors flex items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i> Atualizar
        </button>
      </div>
      
      <div class="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-4" id="listaPlanos">
        <div class="text-center text-slate-400 py-20 font-bold"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i><br>Buscando planos ativos...</div>
      </div>
    </div>
  </div>

  <script>
    const client = window.supabase.createClient('https://cbrwmscaidyeaamyfiyt.supabase.co', 'sb_publishable_neiGbVa2X1nBfX5wT3UGYw_3RWe43_G');
    window.onload = () => carregarPlanos();

    async function buscarProduto() {
      const termo = document.getElementById('buscaProd').value.trim();
      if (!termo) return;
      
      document.getElementById('resBusca').innerHTML = '<div class="text-center text-indigo-400 font-bold text-xs py-4"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Buscando Base de Dados...</div>';
      document.getElementById('formPlano').classList.add('hidden');
      document.getElementById('btnAbrir').classList.add('hidden');
      
      // Busca ampla corrigida (Lógica "OR" abrange Descrição e Códigos)
      const { data } = await client.from('produtos_moove')
        .select('*')
        .or(`n_item.ilike.%${termo}%,cod_moove.ilike.%${termo}%,cod_pax.ilike.%${termo}%,descricao.ilike.%${termo}%`)
        .limit(10);
      
      if (!data || data.length === 0) return document.getElementById('resBusca').innerHTML = '<div class="text-red-500 font-bold text-xs bg-red-50 p-3 rounded-lg border border-red-100 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> Nenhum produto compatível encontrado.</div>';
      
      let html = '';
      data.forEach(r => { 
        let objStr = JSON.stringify({ nItem: r.n_item, desc: r.descricao, moove: r.cod_moove, pax: r.cod_pax, palete: r.qtd_palete });
        html += `
            <div class="p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-indigo-400 hover:shadow-md transition-all group mb-2" onclick='selecionar(${objStr})'>
                <div class="font-black text-slate-700 text-xs mb-1.5 group-hover:text-indigo-700 line-clamp-1">${r.descricao}</div>
                <div class="flex gap-2 text-[9px] font-black text-slate-400 uppercase tracking-widest">
                    <span class="bg-slate-100 px-1.5 py-0.5 rounded">Elvin: <span class="text-slate-600">${r.n_item}</span></span>
                    <span class="bg-slate-100 px-1.5 py-0.5 rounded">Pax: <span class="text-slate-600">${r.cod_pax || '-'}</span></span>
                </div>
            </div>`; 
      });
      document.getElementById('resBusca').innerHTML = html;
    }

    function selecionar(obj) {
      document.getElementById('nItemSelecionado').value = obj.nItem;
      document.getElementById('descSelecionado').innerText = obj.desc;
      document.getElementById('badgeMoove').innerText = `MOOVE: ${obj.moove || '-'}`;
      document.getElementById('badgePax').innerText = `PAX: ${obj.pax || '-'}`;
      document.getElementById('badgePalete').innerText = `FATOR: ${obj.palete} UN`;
      document.getElementById('resBusca').innerHTML = '';
      document.getElementById('formPlano').classList.remove('hidden');
      document.getElementById('btnAbrir').classList.remove('hidden');
      
      document.getElementById('dataProd').value = new Date().toISOString().split('T')[0];
    }

    async function abrirPlano() {
      const item = document.getElementById('nItemSelecionado').value;
      const lote = document.getElementById('loteProd').value.trim().toUpperCase();
      const dataF = document.getElementById('dataProd').value;
      const linha = document.getElementById('linhaEnvase').value;
      const qtd = document.getElementById('qtdPlan').value;
      
      if(!item || !lote || !dataF || !linha || !qtd) return Swal.fire('Atenção','Preencha todos os campos obrigatórios (*), incluindo a Linha de Envase.','warning');
      
      Swal.fire({title: 'Criando Plano...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
      const user = JSON.parse(localStorage.getItem('flowWmsUser')) || {nome:'S/N'};
      const {error} = await client.from('wms_planos_producao').insert([{ n_item: item, lote: lote, data_fabricacao: dataF, linha_envase: linha, qtd_planejada: qtd, criado_por: user.nome }]);
      
      if(error) return Swal.fire('Erro', error.message, 'error');
      
      Swal.fire({title: 'Sucesso', text: 'Plano Ativo! A logística já pode iniciar a puxada.', icon: 'success', timer: 2000, showConfirmButton: false});
      
      document.getElementById('formPlano').classList.add('hidden');
      document.getElementById('btnAbrir').classList.add('hidden');
      document.getElementById('loteProd').value = ''; document.getElementById('qtdPlan').value = ''; document.getElementById('buscaProd').value = ''; document.getElementById('linhaEnvase').value = '';
      carregarPlanos();
    }

    async function carregarPlanos() {
      const tb = document.getElementById('listaPlanos');
      tb.innerHTML = '<div class="text-center text-slate-400 py-20 font-bold"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i><br>Carregando...</div>';
      
      const {data, error} = await client.from('wms_planos_producao').select('*').eq('status','EM ANDAMENTO').order('id',{ascending:false});
      if(error || !data || !data.length) return tb.innerHTML = '<div class="text-center text-slate-400 py-20 font-bold border-2 border-dashed border-slate-300 rounded-2xl bg-white"><i class="fa-solid fa-mug-hot text-4xl mb-4 text-slate-300"></i><br>Nenhuma produção em andamento no momento.</div>';
      
      const { data: prodData } = await client.from('produtos_moove').select('n_item, descricao');
      let dictProd = {}; if(prodData) prodData.forEach(p => dictProd[p.n_item] = p.descricao);

      let html = '';
      data.forEach(p => {
        let df = p.data_fabricacao.split('-').reverse().join('/');
        let desc = dictProd[p.n_item] || 'Descrição Indisponível';
        let linhaTag = p.linha_envase ? `<span class="bg-amber-100 text-amber-700 px-2.5 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest border border-amber-200"><i class="fa-solid fa-industry mr-1"></i> ${p.linha_envase}</span>` : '';
        
        html += `
          <div class="bg-white border border-slate-200 rounded-2xl p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:shadow-md transition-shadow group">
            <div class="flex-1 w-full">
              <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest shadow-sm">#${p.id}</span>
                <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest border border-blue-200 bg-blue-50 px-2 py-1 rounded-lg">LOTE: ${p.lote}</span>
                ${linhaTag}
              </div>
              <h3 class="font-black text-slate-800 text-sm leading-tight mb-2"><span class="text-slate-400 font-bold mr-1">${p.n_item}</span> ${desc}</h3>
              <div class="flex items-center gap-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                  <span class="bg-slate-50 px-2 py-1 border border-slate-100 rounded">Planejado: <span class="text-indigo-600 font-black text-xs">${p.qtd_planejada} UN</span></span>
                  <span>Fab: ${df}</span>
              </div>
            </div>
            <button onclick="encerrarPlano(${p.id}, '${p.lote}')" class="bg-slate-800 hover:bg-black text-white px-6 py-4 rounded-xl text-xs font-black whitespace-nowrap shadow-md w-full md:w-auto transition-transform active:scale-95 flex items-center justify-center gap-2 uppercase tracking-wide">
              Encerrar Envase <i class="fa-solid fa-flag-checkered"></i>
            </button>
          </div>
        `;
      });
      tb.innerHTML = html;
    }

    async function encerrarPlano(id, lote) {
      const {value: finalQtd} = await Swal.fire({
        title: 'Encerrar Lote',
        html: `
            <div class="text-left bg-slate-50 p-4 border border-slate-200 rounded-xl mb-4">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Apontamento Final</p>
                <p class="text-sm font-bold text-slate-700">Lote <span class="text-indigo-600 font-black">${lote}</span> encerrou a produção.</p>
                <p class="text-xs text-slate-500 mt-2">Informe a quantidade <b class="text-slate-800">FÍSICA REAL</b> produzida que consta no ERP para enviar ao FUP Logístico.</p>
            </div>
        `,
        input: 'number', 
        inputAttributes: { min: 1, step: 1 },
        showCancelButton: true, 
        confirmButtonText: '<i class="fa-solid fa-check mr-1"></i> Declarar e Encerrar', 
        confirmButtonColor: '#4f46e5', 
        cancelButtonText: 'Cancelar',
        customClass: { input: 'text-center font-black text-2xl text-indigo-700' }
      });

      if(finalQtd) {
        Swal.fire({title: 'Processando...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
        const user = JSON.parse(localStorage.getItem('flowWmsUser')) || {nome:'S/N'};
        
        await client.from('wms_planos_producao').update({
          qtd_declarada_fim: Number(finalQtd), status: 'AGUARDANDO FECHAMENTO', closed_at: new Date().toISOString()
        }).eq('id', id);

        Swal.fire('Envase Encerrado!','O lote foi enviado para a fila de Auditoria (FUP) da Logística para o recebimento de custódia.','success');
        carregarPlanos();
      }
    }
  </script>
</body>
</html>
