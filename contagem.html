<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-8">
    <div class="mb-6 border-b border-gray-100 pb-4">
      <h2 class="text-2xl font-black text-gray-800 flex items-center gap-3"><div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-box-open"></i></div>Inventário Diário</h2>
    </div>

    <div class="space-y-5">
      <div>
        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Código do Produto (Moove ou Elvin) *</label>
        <div class="flex gap-2">
          <div class="relative flex-grow"><i class="fa-solid fa-barcode absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" id="termoBuscaColetor" onkeypress="if(event.key === 'Enter') buscarProdutoColetor()" class="w-full pl-10 pr-3 py-4 text-xl font-black text-blue-900 border-2 border-blue-200 rounded-xl outline-none focus:border-blue-600" placeholder="Ex: 120932"></div>
          <button id="btnBuscarColetor" onclick="buscarProdutoColetor()" class="bg-blue-600 text-white px-5 rounded-xl font-bold text-lg"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
      </div>

      <div id="resultadosBuscaColetor"></div>

      <div id="areaFormularioColetor" style="display: none;" class="mt-6 pt-6 border-t border-gray-100">
        <div class="mb-5"><label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Descrição do Produto</label><input type="text" id="itemNomeColetor" class="w-full px-4 py-2.5 font-bold text-gray-600 border-2 border-gray-100 rounded-xl bg-slate-50 outline-none" readonly></div>
        <div class="grid grid-cols-1 gap-5 bg-slate-50 p-6 rounded-2xl border border-slate-200">
          <div><label class="block text-[10px] font-black text-gray-500 uppercase mb-2">Lote *</label><input type="text" id="loteColetor" class="w-full px-4 py-3 font-black text-slate-700 uppercase border-2 border-blue-300 rounded-xl outline-none focus:border-blue-600" onblur="verificarLoteColetor()"></div>
          <div><label class="block text-[10px] font-black text-gray-500 uppercase mb-2">Data Fabricação *</label><div class="relative"><input type="date" id="dataFabColetor" class="w-full px-4 py-3 font-black text-slate-700 border-2 border-blue-300 rounded-xl outline-none focus:border-blue-600"><div id="msgDataColetor" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] px-2 py-1 rounded-lg font-bold hidden items-center gap-1"></div></div></div>
          <div><label class="block text-[10px] font-black text-gray-500 uppercase mb-2">Qtde. Contada *</label><div class="relative"><input type="number" id="qtdColetor" class="w-full px-4 py-3 text-3xl font-black text-center text-blue-700 border-2 border-blue-300 rounded-xl outline-none focus:border-blue-600"><span class="absolute right-4 top-1/2 -translate-y-1/2 font-black text-blue-300 text-lg">UN</span></div></div>
        </div>
        <div class="pt-6"><button id="btnSalvarColetor" onclick="salvarContagemColetor()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-lg flex justify-center gap-2"><i class="fa-solid fa-check-circle"></i> GRAVAR CONTAGEM</button></div>
      </div>
    </div>
  </div>

  <script>
    const client = window.supabase.createClient('https://cbrwmscaidyeaamyfiyt.supabase.co', 'sb_publishable_neiGbVa2X1nBfX5wT3UGYw_3RWe43_G');
    let itemAtualColetor = {};

    async function buscarProdutoColetor() {
      const termo = document.getElementById('termoBuscaColetor').value.trim().replace(/\D/g, '');
      if (!termo) return;
      document.getElementById('resultadosBuscaColetor').innerHTML = ''; document.getElementById('areaFormularioColetor').style.display = 'none';
      const { data, error } = await client.from('produtos_moove').select('*').or(`n_item.ilike.%${termo}%,cod_moove.ilike.%${termo}%,cod_pax.ilike.%${termo}%`).limit(5);
      if (error || !data || data.length === 0) return document.getElementById('resultadosBuscaColetor').innerHTML = `<div class="p-4 bg-red-50 text-red-700 border border-red-300 rounded-xl font-bold">Produto não encontrado.</div>`;
      
      let html = '';
      data.forEach((r, idx) => {
        const obj = { nItem: r.n_item, desc: r.descricao, moove: r.cod_moove, pax: r.cod_pax, qtdePalete: r.qtd_palete };
        html += `<div class="p-4 mb-3 bg-white border-2 border-slate-200 rounded-xl cursor-pointer hover:border-blue-500" onclick='selecionarItem(${JSON.stringify(obj)})'><div class="font-black text-gray-800">${r.descricao}</div><div class="text-xs font-bold text-slate-500 mt-1">Elvin: ${r.n_item} | Moove: ${r.cod_moove}</div></div>`;
      });
      document.getElementById('resultadosBuscaColetor').innerHTML = html;
    }

    function selecionarItem(item) {
      itemAtualColetor = item;
      document.getElementById('itemNomeColetor').value = item.desc;
      document.getElementById('areaFormularioColetor').style.display = 'block';
      document.getElementById('resultadosBuscaColetor').innerHTML = '';
      setTimeout(() => document.getElementById('loteColetor').focus(), 100);
    }

    async function verificarLoteColetor() {
      const lote = document.getElementById('loteColetor').value.trim().toUpperCase(); const nItem = itemAtualColetor.nItem;
      const msg = document.getElementById('msgDataColetor');
      if (lote && nItem) {
        msg.style.display = 'flex'; msg.innerHTML = `Buscando...`;
        const { data } = await client.from('inventario_pa').select('data_fabricacao').eq('n_item', nItem).eq('lote', lote).order('id', { ascending: false }).limit(1);
        if (data && data.length > 0 && data[0].data_fabricacao) {
          document.getElementById('dataFabColetor').value = data[0].data_fabricacao; msg.className = "absolute right-2 top-1/2 -translate-y-1/2 text-[10px] px-2 py-1 rounded-lg font-bold flex items-center gap-1 bg-green-100 text-green-800"; msg.innerHTML = `Histórico`;
        } else {
          document.getElementById('dataFabColetor').value = ''; msg.className = "absolute right-2 top-1/2 -translate-y-1/2 text-[10px] px-2 py-1 rounded-lg font-bold flex items-center gap-1 bg-amber-100 text-amber-900"; msg.innerHTML = `Novo`;
        }
      }
    }

    async function salvarContagemColetor() {
      const lote = document.getElementById('loteColetor').value.trim().toUpperCase();
      const dataFab = document.getElementById('dataFabColetor').value;
      const qtd = parseFloat(document.getElementById('qtdColetor').value) || 0;
      if (!lote || !dataFab || qtd <= 0) return Swal.fire('Atenção', 'Preencha todos os campos.', 'warning');
      
      const btn = document.getElementById('btnSalvarColetor'); btn.disabled = true; btn.innerHTML = `Gravando...`;
      const hoje = new Date().toISOString().split('T')[0];

      try {
        const { data: busca } = await client.from('inventario_pa').select('id, qtd_fisica').eq('data_inventario', hoje).eq('n_item', itemAtualColetor.nItem).eq('lote', lote);
        if (busca && busca.length > 0) {
          await client.from('inventario_pa').update({ qtd_fisica: parseFloat(busca[0].qtd_fisica) + qtd }).eq('id', busca[0].id);
        } else {
          await client.from('inventario_pa').insert([{ data_inventario: hoje, n_item: itemAtualColetor.nItem, lote: lote, data_fabricacao: dataFab, qtd_fisica: qtd }]);
        }
        Swal.fire({ title: 'Salvo!', icon: 'success', timer: 1500, showConfirmButton: false });
        document.getElementById('areaFormularioColetor').style.display = 'none'; document.getElementById('termoBuscaColetor').value = '';
        btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> GRAVAR CONTAGEM`;
      } catch (err) { Swal.fire('Erro', 'Falha ao salvar.', 'error'); btn.disabled = false; }
    }
  </script>
</body>
</html>
