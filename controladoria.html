<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  </style>
</head>
<body class="p-8">

  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
    <div class="flex items-center gap-5">
      <div class="bg-gradient-to-br from-[#001A70] to-blue-800 p-4 rounded-2xl shadow-lg text-white">
        <i class="fa-solid fa-file-signature text-3xl"></i>
      </div>
      <div>
        <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tight">Painel de Controladoria</h1>
        <p class="text-slate-500 font-bold text-sm">Liberação Sistêmica de O.P. e Expedição</p>
      </div>
    </div>
    
    <div class="flex items-center gap-4">
      <div class="bg-slate-50 px-5 py-3 border-2 border-slate-100 rounded-2xl flex items-center gap-3">
        <div class="bg-blue-100 text-blue-700 p-2 rounded-lg"><i class="fa-solid fa-calendar-day"></i></div>
        <div class="flex flex-col">
          <label class="text-[0.65rem] font-black text-slate-400 uppercase tracking-widest">Estoque do Dia</label>
          <input type="date" id="filtroDataCtrl" class="text-sm font-black text-slate-800 border-none outline-none cursor-pointer bg-transparent" onchange="carregarDadosControladoria()">
        </div>
      </div>
      <button onclick="carregarDadosControladoria()" class="bg-[#0055A5] hover:bg-blue-700 text-white p-4 rounded-2xl shadow-md active:scale-95">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </div>

  <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-2 flex-1 flex flex-col h-[65vh]">
    <div class="overflow-y-auto custom-scrollbar rounded-2xl flex-1">
      <table class="w-full text-left border-collapse min-w-[800px]">
        <thead>
          <tr>
            <th class="bg-[#001A70] text-white text-xs font-black uppercase tracking-wider p-4 sticky top-0 rounded-tl-2xl">Item</th>
            <th class="bg-[#001A70] text-white text-xs font-black uppercase tracking-wider p-4 sticky top-0">Descrição</th>
            <th class="bg-[#001A70] text-white text-xs font-black uppercase tracking-wider p-4 sticky top-0 text-center">Lote</th>
            <th class="bg-[#001A70] text-white text-xs font-black uppercase tracking-wider p-4 sticky top-0 text-center">Volume (UN)</th>
            <th class="bg-[#001A70] text-white text-xs font-black uppercase tracking-wider p-4 sticky top-0 text-center border-l border-blue-800">Status O.P.</th>
            <th class="bg-[#001A70] text-white text-xs font-black uppercase tracking-wider p-4 sticky top-0 text-center rounded-tr-2xl">Liberação Expedição</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaControladoria">
          <tr><td colspan="6" class="text-center py-10 font-bold text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-2 text-blue-500"></i> Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const client = window.supabase.createClient('https://cbrwmscaidyeaamyfiyt.supabase.co', 'sb_publishable_neiGbVa2X1nBfX5wT3UGYw_3RWe43_G');
    
    document.getElementById('filtroDataCtrl').value = new Date().toISOString().split('T')[0];
    carregarDadosControladoria();

    async function carregarDadosControladoria() {
      const dataSelecionada = document.getElementById('filtroDataCtrl').value;
      const tbody = document.getElementById('corpoTabelaControladoria');
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 font-bold text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-2 text-blue-500"></i> Buscando...</td></tr>`;
      
      const { data: invData } = await client.from('inventario_pa').select('n_item, lote, qtd_fisica, produtos_moove(descricao)').eq('data_inventario', dataSelecionada);

      if (!invData || invData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-16 font-bold text-slate-400">Nenhum lote consolidado para este dia.</td></tr>`;
        return;
      }

      let agrupado = {};
      invData.forEach(row => {
        let chave = `${row.n_item}_${row.lote}`;
        if (!agrupado[chave]) agrupado[chave] = { nItem: row.n_item, desc: row.produtos_moove ? row.produtos_moove.descricao : 'N/A', lote: row.lote, qtdTotal: 0, dataOp: "", statusExpedicao: "AGUARDANDO" };
        agrupado[chave].qtdTotal += parseFloat(row.qtd_fisica);
      });

      const { data: ctrlData } = await client.from('controle_op').select('*');
      let mapaCtrl = {};
      if (ctrlData) ctrlData.forEach(c => { mapaCtrl[`${c.n_item}_${c.lote}`] = c; });

      let dados = [];
      for (let chave in agrupado) {
        let item = agrupado[chave];
        if (mapaCtrl[chave]) {
          let info = mapaCtrl[chave];
          if (info.data_op) item.dataOp = new Date(info.data_op).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
          item.statusExpedicao = info.status_expedicao || "AGUARDANDO";
        }
        dados.push(item);
      }

      let html = '';
      dados.forEach(d => {
        let boxOP = (!d.dataOp || d.dataOp === "") 
          ? `<button onclick="confirmarOP('${d.nItem}', '${d.lote}')" class="w-full bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-700 border-2 border-slate-200 px-3 py-2 rounded-xl text-xs font-black transition-all flex justify-center items-center gap-2"><i class="fa-solid fa-check-circle"></i> Confirmar OP</button>` 
          : `<div class="bg-green-50 border border-green-200 text-green-700 px-3 py-2 rounded-xl text-xs font-black flex items-center justify-center gap-2"><i class="fa-solid fa-file-circle-check"></i> ${d.dataOp}</div>`;

        let disabledAttr = (!d.dataOp || d.dataOp === "") ? "disabled" : "";
        let opacidade = (!d.dataOp || d.dataOp === "") ? "opacity-50 cursor-not-allowed" : "cursor-pointer";
        
        let corSelect = "bg-slate-100 border-slate-200 text-slate-600";
        if (d.statusExpedicao === "LIBERADO") corSelect = "bg-blue-50 border-blue-300 text-blue-700";
        if (d.statusExpedicao === "BLOQUEADO" || d.statusExpedicao === "NÃO") corSelect = "bg-red-50 border-red-300 text-red-700";

        html += `
          <tr class="hover:bg-slate-50 border-b border-slate-100">
            <td class="p-4"><span class="bg-white px-2 py-1 rounded-lg border border-slate-200 text-xs font-bold text-slate-600">${d.nItem}</span></td>
            <td class="p-4 text-xs font-bold text-slate-600 truncate max-w-[200px]" title="${d.desc}">${d.desc}</td>
            <td class="p-4 text-center font-black text-slate-800 text-xs">${d.lote}</td>
            <td class="p-4 text-center font-black text-[#0055A5]">${d.qtdTotal.toLocaleString('pt-BR')}</td>
            <td class="p-4 text-center border-l border-slate-100 px-6">${boxOP}</td>
            <td class="p-4 text-center px-6">
              <select onchange="alterarExpedicao('${d.nItem}', '${d.lote}', this.value)" class="w-full font-black text-xs px-3 py-2 rounded-xl border-2 outline-none transition-colors ${corSelect} ${opacidade}" ${disabledAttr} style="appearance: none; text-align-last: center;">
                <option value="AGUARDANDO" ${d.statusExpedicao === 'AGUARDANDO' ? 'selected' : ''}>Aguardando</option>
                <option value="LIBERADO" ${d.statusExpedicao === 'LIBERADO' ? 'selected' : ''}>Liberar P/ Expedição</option>
                <option value="BLOQUEADO" ${d.statusExpedicao === 'BLOQUEADO' || d.statusExpedicao === 'NÃO' ? 'selected' : ''}>Bloqueado</option>
              </select>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    async function confirmarOP(nItem, lote) {
      const { isConfirmed } = await Swal.fire({ title: 'Confirmar Entrada de O.P.', html: `Deseja dar o <b>OK de Recebimento</b> para o lote <br><span class="text-blue-600 font-black text-lg">${lote}</span>?`, icon: 'question', showCancelButton: true, confirmButtonColor: '#001A70', confirmButtonText: 'Confirmar', cancelButtonText: 'Cancelar' });
      if (isConfirmed) {
        Swal.fire({ title: 'Gravando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
        const agora = new Date().toISOString();
        await client.from('controle_op').upsert({ n_item: nItem, lote: lote, data_op: agora, status_expedicao: 'AGUARDANDO', data_atualizacao: agora }, { onConflict: 'n_item,lote' });
        Swal.fire({ title: 'Salvo!', icon: 'success', timer: 1200, showConfirmButton: false });
        carregarDadosControladoria();
      }
    }

    async function alterarExpedicao(nItem, lote, novoStatus) {
      if(novoStatus === "AGUARDANDO") return;
      Swal.fire({ title: 'Gravando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
      await client.from('controle_op').update({ status_expedicao: novoStatus, data_atualizacao: new Date().toISOString() }).eq('n_item', nItem).eq('lote', lote);
      Swal.fire({ title: 'Salvo!', icon: 'success', timer: 1200, showConfirmButton: false });
      carregarDadosControladoria();
    }
  </script>
</body>
</html>
