<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; padding: 2rem; }
    .card-modern { background: white; border-radius: 1.25rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="max-w-6xl mx-auto flex flex-col gap-6 h-[85vh]">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 card-modern p-6 shrink-0">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-cyan-50 text-cyan-600 rounded-2xl flex items-center justify-center text-2xl border border-cyan-100 shadow-sm">
          <i class="fa-solid fa-boxes-packing"></i>
        </div>
        <div>
          <h1 class="text-3xl font-black text-slate-800 tracking-tight">Conferência Cega</h1>
          <p class="text-slate-500 font-bold text-sm">Recebimento de P.A. da Produção</p>
        </div>
      </div>
      <button onclick="carregarPendentes()" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-5 py-3 rounded-xl font-bold text-sm flex items-center gap-2 shadow-sm transition-colors active:scale-95">
        <i class="fa-solid fa-rotate-right text-cyan-500"></i> Atualizar Lista
      </button>
    </div>

    <div class="card-modern overflow-hidden flex-1 flex flex-col">
      <div class="bg-white border-b border-slate-100 p-5 shrink-0">
        <h3 class="text-[11px] font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">
          <i class="fa-solid fa-clock text-amber-500"></i> Aguardando Conferência
        </h3>
      </div>
      <div class="flex-1 overflow-y-auto custom-scrollbar p-2">
        <table class="w-full text-left min-w-[800px]">
          <thead class="bg-slate-50 sticky top-0">
            <tr>
              <th class="p-4 text-[10px] font-black text-slate-400 uppercase border-b border-slate-200 w-[15%]">Data Reg.</th>
              <th class="p-4 text-[10px] font-black text-slate-400 uppercase border-b border-slate-200 w-[15%]">Cód. Elvin</th>
              <th class="p-4 text-[10px] font-black text-slate-400 uppercase border-b border-slate-200 w-[30%]">Lote</th>
              <th class="p-4 text-[10px] font-black text-slate-400 uppercase border-b border-slate-200 text-center w-[20%]">Status</th>
              <th class="p-4 text-[10px] font-black text-slate-400 uppercase border-b border-slate-200 text-center w-[20%]">Ação</th>
            </tr>
          </thead>
          <tbody id="tabelaPendentes" class="divide-y divide-slate-100">
            <tr><td colspan="5" class="text-center py-10 font-bold text-slate-400">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const client = window.supabase.createClient('https://cbrwmscaidyeaamyfiyt.supabase.co', 'sb_publishable_neiGbVa2X1nBfX5wT3UGYw_3RWe43_G');
    
    window.onload = () => carregarPendentes();

    async function carregarPendentes() {
      const tb = document.getElementById('tabelaPendentes');
      tb.innerHTML = '<tr><td colspan="5" class="text-center py-10 font-bold text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Buscando cargas...</td></tr>';
      
      const { data, error } = await client.from('recebimento_wms').select('*').eq('status', 'AGUARDANDO CONFERENCIA').order('id', { ascending: false });

      if (error || !data || data.length === 0) {
        tb.innerHTML = '<tr><td colspan="5" class="text-center py-16 font-bold text-slate-400 text-lg"><i class="fa-regular fa-circle-check text-emerald-400 text-3xl mb-3 block"></i>Fábrica limpa. Nenhum lote pendente.</td></tr>';
        return;
      }

      let html = '';
      data.forEach(d => {
        let dtFormat = d.data_registro.split('-').reverse().join('/');
        html += `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="p-4 text-xs font-bold text-slate-500">${dtFormat}</td>
            <td class="p-4"><span class="font-bold text-slate-700 text-xs bg-white border border-slate-200 shadow-sm px-2 py-1 rounded">${d.n_item}</span></td>
            <td class="p-4 font-black text-slate-800 text-sm">${d.lote} <span class="block text-[9px] text-slate-400 font-bold mt-0.5">FAB: ${d.data_fabricacao.split('-').reverse().join('/')}</span></td>
            <td class="p-4 text-center"><span class="bg-amber-50 border border-amber-200 text-amber-600 px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest"><i class="fa-solid fa-clock mr-1"></i> Aguardando</span></td>
            <td class="p-4 text-center">
              <button onclick='abrirConferencia(${JSON.stringify(d)})' class="bg-cyan-500 hover:bg-cyan-600 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow-md transition-colors shadow-cyan-500/30">
                <i class="fa-solid fa-check-double mr-1"></i> Conferir Físico
              </button>
            </td>
          </tr>`;
      });
      tb.innerHTML = html;
    }

    async function abrirConferencia(item) {
      const { value: qtdLogistica } = await Swal.fire({
        title: 'Conferência Cega',
        html: `
          <div class="text-left bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Item / Lote</p>
            <p class="font-black text-slate-700 text-lg">${item.n_item}</p>
            <p class="font-bold text-cyan-600">${item.lote}</p>
          </div>
          <p class="text-sm font-bold text-slate-600 mb-2">Digite a quantidade exata contada nos paletes:</p>
        `,
        input: 'number',
        inputPlaceholder: '0 UN',
        showCancelButton: true,
        confirmButtonColor: '#06b6d4',
        cancelButtonColor: '#cbd5e1',
        confirmButtonText: 'Validar Saldo',
        cancelButtonText: 'Cancelar',
        inputValidator: (value) => { if (!value || value <= 0) return 'Informe uma quantidade válida!'; }
      });

      if (qtdLogistica) {
        processarConferencia(item, parseFloat(qtdLogistica));
      }
    }

    async function processarConferencia(item, qtdDigitada) {
      Swal.fire({ title: 'Analisando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
      const user = JSON.parse(localStorage.getItem('flowWmsUser')) || { nome: 'Desconhecido' };
      const qtdProd = parseFloat(item.qtd_producao);
      
      if (qtdDigitada === qtdProd) {
        // APROVADO! Bateu exatamente.
        await client.from('recebimento_wms').update({ status: 'APROVADO', qtd_logistica: qtdDigitada, usuario_logistica: user.nome }).eq('id', item.id);
        
        // Atualiza o Dashboard (Tabela inventario_pa)
        const hoje = new Date().toISOString().split('T')[0];
        const { data: inv } = await client.from('inventario_pa').select('id, qtd_fisica').eq('data_inventario', hoje).eq('n_item', item.n_item).eq('lote', item.lote);
        
        if (inv && inv.length > 0) {
          await client.from('inventario_pa').update({ qtd_fisica: parseFloat(inv[0].qtd_fisica) + qtdDigitada }).eq('id', inv[0].id);
        } else {
          await client.from('inventario_pa').insert([{ data_inventario: hoje, n_item: item.n_item, lote: item.lote, data_fabricacao: item.data_fabricacao, qtd_fisica: qtdDigitada }]);
        }

        Swal.fire({ title: 'Aprovado!', text: 'A contagem bateu. Saldo adicionado ao WMS.', icon: 'success', confirmButtonColor: '#10b981' });
        
      } else {
        // DIVERGENTE! Travado para o gestor.
        await client.from('recebimento_wms').update({ status: 'DIVERGENTE', qtd_logistica: qtdDigitada, usuario_logistica: user.nome }).eq('id', item.id);
        Swal.fire({ title: 'Divergência!', text: 'A sua contagem não bate com a Produção. O lote foi bloqueado e enviado para a Gestão.', icon: 'error', confirmButtonColor: '#ef4444' });
      }

      carregarPendentes();
    }
  </script>
</body>
</html>
