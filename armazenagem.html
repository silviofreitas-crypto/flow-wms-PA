<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    .input-pda { width: 100%; background: #fff; border: 2px solid #cbd5e1; font-weight: 900; font-size: 1.5rem; text-align: center; border-radius: 0.75rem; padding: 1rem; outline: none; transition: border 0.2s; color: #0f172a; text-transform: uppercase; }
    .input-pda:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
  </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-start min-h-screen">
  
  <div class="w-full max-w-md bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
    <div class="bg-slate-800 p-6 text-white text-center relative overflow-hidden">
      <div class="absolute -right-6 -top-6 text-white opacity-5 text-7xl"><i class="fa-solid fa-cubes-stacked"></i></div>
      <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto text-3xl mb-3 relative z-10 backdrop-blur-sm"><i class="fa-solid fa-cubes-stacked text-emerald-400"></i></div>
      <h1 class="text-2xl font-black tracking-tight relative z-10">Armazenagem (Putaway)</h1>
      <p class="text-slate-300 text-xs font-bold uppercase tracking-widest mt-1 relative z-10">PDA Operador</p>
    </div>

    <div class="p-6 space-y-6">
      
      <!-- MENU SUSPENSO DOS PENDENTES -->
      <div>
        <div class="flex justify-between items-end mb-2">
          <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Paletes na Zona de Transição <span class="text-red-500">*</span></label>
          <button onclick="carregarPaletesPendentes()" class="text-emerald-600 hover:text-emerald-700 text-[10px] font-black uppercase"><i class="fa-solid fa-rotate-right"></i> Atualizar</button>
        </div>
        <select id="selPalete" onchange="buscarInfoPalete()" class="w-full bg-slate-50 border-2 border-slate-200 text-slate-800 font-bold p-3.5 rounded-xl outline-none focus:border-emerald-500 cursor-pointer text-sm">
          <option value="">Carregando paletes...</option>
        </select>
      </div>

      <!-- CARD DE INFO DO PALETE (Injetado dinamicamente com as infos completas) -->
      <div id="cardInfoPalete" class="hidden bg-emerald-50 border border-emerald-100 rounded-xl p-4 shadow-sm">
        <div class="flex justify-between items-start mb-2">
          <p class="text-[9px] font-black text-emerald-600 uppercase tracking-widest" id="lblCodPalete">PLT-XXXX</p>
          <span class="bg-white border border-emerald-200 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-black uppercase" id="lblQtd">0 UN</span>
        </div>
        <p class="font-black text-slate-800 text-sm leading-tight mb-2" id="lblDesc">DESCRIÇÃO DO PRODUTO</p>
        <div class="flex gap-2">
          <span class="bg-white border border-emerald-200 text-emerald-700 px-2 py-0.5 rounded text-[9px] font-black uppercase" id="lblMoove">MOOVE: --</span>
          <span class="bg-white border border-emerald-200 text-emerald-700 px-2 py-0.5 rounded text-[9px] font-black uppercase" id="lblPax">PAX: --</span>
        </div>
      </div>

      <!-- ENDEREÇO DE DESTINO -->
      <div id="divEndereco" class="hidden">
        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Bipar Endereço de Destino <span class="text-red-500">*</span></label>
        <div class="relative">
          <input type="text" id="endereco" class="input-pda" placeholder="A-01-05">
          <i class="fa-solid fa-location-dot absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-xl"></i>
        </div>
      </div>

      <button id="btnGuardar" onclick="guardarPalete()" class="hidden w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg py-4 rounded-xl shadow-lg shadow-emerald-500/30 transition-all active:scale-95 flex justify-center items-center gap-2">
        <i class="fa-solid fa-check"></i> CONFIRMAR ARMAZENAGEM
      </button>
    </div>
  </div>

  <script>
    const client = window.supabase.createClient('https://cbrwmscaidyeaamyfiyt.supabase.co', 'sb_publishable_neiGbVa2X1nBfX5wT3UGYw_3RWe43_G');
    let paletesGlobais = [];
    let produtosGlobais = {};
    let paleteAtual = null;

    window.onload = () => carregarPaletesPendentes();

    async function carregarPaletesPendentes() {
      const sel = document.getElementById('selPalete');
      
      // Oculta tudo na atualização
      document.getElementById('cardInfoPalete').classList.add('hidden');
      document.getElementById('divEndereco').classList.add('hidden');
      document.getElementById('btnGuardar').classList.add('hidden');
      paleteAtual = null;
      
      sel.innerHTML = '<option value="">Buscando na área de transição...</option>';

      // Busca os paletes
      const { data, error } = await client.from('wms_paletes').select('*').eq('status', 'TRANSICAO').order('id', { ascending: true });
      
      if(error || !data || data.length === 0) {
        sel.innerHTML = '<option value="">Transição Limpa! Nenhum palete.</option>';
        return;
      }
      
      paletesGlobais = data;
      
      // Busca os produtos para enriquecer a UI
      const {data: prods} = await client.from('produtos_moove').select('*');
      if(prods) prods.forEach(p => produtosGlobais[p.n_item] = p);

      sel.innerHTML = '<option value="">-- SELECIONE O PALETE PENDENTE --</option>';
      data.forEach(p => { 
        sel.innerHTML += `<option value="${p.id}">${p.codigo_palete} (Qtd: ${p.qtd})</option>`; 
      });
    }

    function buscarInfoPalete() {
      const pid = document.getElementById('selPalete').value;
      const card = document.getElementById('cardInfoPalete');
      
      if(!pid) {
        card.classList.add('hidden');
        document.getElementById('divEndereco').classList.add('hidden');
        document.getElementById('btnGuardar').classList.add('hidden');
        paleteAtual = null;
        return;
      }
      
      paleteAtual = paletesGlobais.find(p => p.id == pid);
      const prod = produtosGlobais[paleteAtual.n_item] || { descricao: 'S/ DESCRIÇÃO', cod_moove: 'N/A', cod_pax: 'N/A' };
      
      // Preenche os dados ricos
      document.getElementById('lblCodPalete').innerText = paleteAtual.codigo_palete;
      document.getElementById('lblQtd').innerText = `${paleteAtual.qtd} UN`;
      document.getElementById('lblDesc').innerText = prod.descricao;
      document.getElementById('lblMoove').innerText = `MOOVE: ${prod.cod_moove}`;
      document.getElementById('lblPax').innerText = `PAX: ${prod.cod_pax}`;
      
      // Exibe os campos
      card.classList.remove('hidden');
      document.getElementById('divEndereco').classList.remove('hidden');
      document.getElementById('btnGuardar').classList.remove('hidden');
      document.getElementById('btnGuardar').classList.add('flex'); // Volta a ser flexbox
      
      document.getElementById('endereco').focus();
    }

    async function guardarPalete() {
      if(!paleteAtual) return Swal.fire('Atenção', 'Selecione um palete na lista.', 'warning');
      
      const end = document.getElementById('endereco').value.trim().toUpperCase();
      if(!end) return Swal.fire('Atenção', 'Informe o endereço de armazenagem.', 'warning');

      const user = JSON.parse(localStorage.getItem('flowWmsUser')) || {nome:'Operador'};
      Swal.fire({title: 'Guardando...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});

      const {error} = await client.from('wms_paletes').update({
        status: 'ARMAZENADO', 
        endereco: end, 
        armazenado_por: user.nome, 
        armazenado_em: new Date().toISOString()
      }).eq('id', paleteAtual.id);

      if(error) return Swal.fire('Erro', error.message, 'error');

      const Toast = Swal.mixin({ toast: true, position: "top-end", showConfirmButton: false, timer: 1500 });
      Toast.fire({ icon: "success", title: "Armazenado com sucesso!" });
      
      // Limpa os campos e atualiza a lista de pendentes
      document.getElementById('endereco').value = '';
      carregarPaletesPendentes();
    }
  </script>
</body>
</html>
